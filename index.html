<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Hunta — заказы для фрилансеров</title>
<meta name="description" content="Hunta: платформа, где заказчики оставляют задачи, а фрилансеры берут их в работу. Тарифы от 30 000 сум, скидки каждую пятницу и в священные праздники.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0a0a0a; --bg2:#141414; --bg3:#1b1b1b;
  --tx:#e8e8e8; --tx2:#9a9a9a; --bd:#2a2a2a;
  --ac:#00ff88; --hot:#ff0055;
  --display:'Unbounded','Manrope',system-ui,sans-serif;
  --body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(110px + env(safe-area-inset-top,0px));scroll-behavior:smooth;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:500 17px/1.6 var(--body);overflow-x:hidden;-webkit-text-size-adjust:100%;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(42,42,42,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(42,42,42,.16) 1px,transparent 1px);
  background-size:50px 50px}
main,footer,.top{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
::selection{background:var(--ac);color:#000}
.wrap{width:min(100% - 40px,1080px);margin-inline:auto}
h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;line-height:1.1}
h2{font-size:clamp(26px,4.4vw,44px);font-weight:600}
.sec{padding:96px 0}
.sec-sub{color:var(--tx2);max-width:56ch;margin-top:16px}
.rule{display:block;width:72px;height:4px;background:var(--ac);margin-top:20px}

/* ---------- top: sale bar + header ---------- */
.top{position:fixed;top:0;left:0;right:0;padding-top:env(safe-area-inset-top,0px);z-index:50}
.bar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--hot);color:#fff;font-weight:700;font-size:14px;line-height:1.3;padding:8px 14px;text-align:center}
.bar.live{background:var(--ac);color:#000}
.bar b{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.28);padding:2px 10px;border-radius:999px;letter-spacing:0}
.bar.live b{background:rgba(0,0,0,.14)}
.hd{display:flex;justify-content:space-between;align-items:center;padding:12px max(20px,calc((100% - 1080px)/2));
  background:rgba(10,10,10,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.04em;display:flex;align-items:center;gap:9px}
.logo svg{width:22px;height:22px}
.hd-r{display:flex;align-items:center;gap:14px}
.tg{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);color:var(--tx2);transition:color .3s,border-color .3s}
.tg:hover{color:var(--ac);border-color:var(--ac)}
.tg svg{width:18px;height:18px}
.lang{position:relative;display:flex;border:1px solid var(--bd);border-radius:999px;padding:3px;background:var(--bg2)}
.lang i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--ac);border-radius:999px;transition:transform .4s cubic-bezier(.65,0,.2,1)}
.lang[data-l="uz"] i{transform:translateX(100%)}
.lang button{position:relative;z-index:1;min-width:46px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--tx2);transition:color .3s}
.lang button[aria-pressed="true"]{color:#000}

/* ---------- hero ---------- */
.hero{position:relative;padding:190px 0 80px;overflow:hidden}
.hero-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(520px circle at var(--mx,70%) var(--my,35%),rgba(0,255,136,.12),transparent 70%)}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(38px,6.2vw,76px);font-weight:800;line-height:1.02;letter-spacing:-.045em}
.lead{color:var(--tx2);font-size:clamp(16px,1.6vw,19px);margin:26px 0 34px;max-width:46ch}
.cta{display:flex;flex-wrap:wrap;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 28px;border-radius:999px;font-weight:700;font-size:16px;
  border:2px solid var(--ac);position:relative;overflow:hidden;z-index:0;transition:color .35s var(--ease),box-shadow .35s var(--ease);text-align:center}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;transform:translateY(101%);transition:transform .4s var(--ease)}
.btn:hover::before{transform:translateY(0)}
.btn-p{background:var(--ac);color:#000}
.btn-p::before{background:#fff}
.btn-p:hover{box-shadow:0 0 28px rgba(0,255,136,.35)}
.btn-s{color:var(--ac)}
.btn-s::before{background:var(--ac)}
.btn-s:hover{color:#000}
.btn-hot{background:var(--hot);border-color:var(--hot);color:#fff}
.btn-hot::before{background:#fff}
.btn-hot:hover{color:var(--hot)}

/* hunting field: the one memorable moment */
.field{position:relative;aspect-ratio:1/.92;min-height:330px;border:1px dashed #3a3a3a;border-radius:28px;background:
  radial-gradient(circle at 50% 50%,rgba(0,255,136,.07),transparent 62%),var(--bg2);overflow:hidden}
.field::before,.field::after{content:"";position:absolute;background:#262626}
.field::before{left:50%;top:0;bottom:0;width:1px}
.field::after{top:50%;left:0;right:0;height:1px}
.chip{position:absolute;transform:translate(-50%,-50%);z-index:2;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--bg3);font-size:14px;font-weight:600;color:var(--tx);
  transition:background .3s,color .3s,border-color .3s,box-shadow .3s}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hot);transition:background .3s}
.chip.lock{background:var(--ac);color:#000;border-color:var(--ac);box-shadow:0 0 26px rgba(0,255,136,.45)}
.chip.lock::before{background:#000}
.ret{position:absolute;left:0;top:0;z-index:1;width:96px;height:96px;pointer-events:none;color:var(--hot);
  transform:translate(50%,50%) translate(-50%,-50%);transition:transform .9s cubic-bezier(.65,0,.2,1),color .3s}
.ret.on{color:var(--ac)}
.ret svg{width:100%;height:100%;overflow:visible}
.ret.on svg{animation:snap .5s var(--ease)}
@keyframes snap{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.field-note{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--tx2);z-index:2}

/* ---------- proof ---------- */
.proof{border-block:1px solid var(--bd);background:rgba(20,20,20,.7)}
.proof ul{display:grid;grid-template-columns:repeat(3,1fr)}
.proof li{padding:34px 24px;border-left:1px solid var(--bd)}
.proof li:first-child{border-left:0;padding-left:0}
.proof strong{display:block;font-family:var(--display);font-weight:800;font-size:clamp(30px,4.6vw,54px);letter-spacing:-.05em;line-height:1;color:var(--ac)}
.proof span{display:block;margin-top:10px;color:var(--tx2);font-size:15px}
.proof small{display:block;padding:0 0 22px;color:#6f6f6f;font-size:12.5px}

/* ---------- how it works ---------- */
.how-frame{position:relative;display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;padding:clamp(28px,5vw,64px);
  border:1px solid var(--ac);border-radius:32px;background:linear-gradient(130deg,rgba(0,255,136,.09),rgba(0,255,136,.015) 55%),var(--bg2);overflow:hidden}
.how-frame::after{content:"";position:absolute;right:-120px;top:-120px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(0,255,136,.22),transparent 70%);pointer-events:none}
.roles{display:inline-flex;margin:30px 0 28px;border:1px solid var(--bd);border-radius:999px;padding:4px;background:var(--bg)}
.roles button{padding:10px 22px;border-radius:999px;font-weight:700;font-size:15px;color:var(--tx2);transition:background .3s,color .3s}
.roles button[aria-selected="true"]{background:var(--ac);color:#000}
.steps{position:relative;counter-reset:s;display:grid;gap:0}
.steps li{position:relative;padding:0 0 30px 64px;counter-increment:s}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--bg);border:1px solid var(--ac);color:var(--ac);font-family:var(--display);font-weight:600;font-size:16px}
.steps li::after{content:"";position:absolute;left:22px;top:48px;bottom:4px;width:1px;background:linear-gradient(var(--ac),transparent)}
.steps li:last-child::after{display:none}
.steps h3{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:2px 0 6px}
.steps p{color:var(--tx2);font-size:16px}
.steps.swap{animation:swap .45s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}


.full{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 26px;border-radius:22px;
  background:var(--ac);color:#000;position:relative;z-index:1;animation:pulse 2.4s ease-in-out infinite;transition:transform .3s var(--ease)}
.full:hover{transform:translateY(-3px)}
.full-t{display:flex;flex-direction:column;gap:2px}
.full-t b{font-family:var(--display);font-weight:600;font-size:clamp(17px,2.3vw,24px);letter-spacing:-.03em;line-height:1.2}
.full-t small{font-size:14.5px;font-weight:600;opacity:.75}
.full-a{flex:none;width:56px;height:56px;border-radius:50%;background:#000;color:var(--ac);display:grid;place-items:center}
.full-a svg{width:26px;height:26px;animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(-3px)}50%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,255,136,.5)}60%{box-shadow:0 0 0 16px rgba(0,255,136,0)}}

/* ---------- plans ---------- */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:56px;align-items:stretch}
.plan{position:relative;display:flex;flex-direction:column;padding:32px 28px;border:1px solid var(--bd);border-radius:22px;background:var(--bg2)}
.plan.premium{border-radius:22px 22px 22px 6px}
.plan.pick{border:2px solid var(--ac);background:linear-gradient(160deg,rgba(0,255,136,.1),rgba(0,255,136,.02) 60%),var(--bg2);box-shadow:0 0 44px rgba(0,255,136,.12)}
.badge{position:absolute;top:-14px;left:24px;background:var(--ac);color:#000;font-weight:800;font-size:13px;padding:5px 14px;border-radius:999px}
.plan h3{font-size:18px;font-weight:600;color:var(--tx2)}
.pr{margin:18px 0 4px;display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px}
.pr .now{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,46px);letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.pick .pr .now{color:var(--ac)}
.pr .old{color:#777;text-decoration:line-through;text-decoration-color:var(--hot);text-decoration-thickness:2px;font-weight:600;font-size:18px}
.unit{color:var(--tx2);font-size:15px}
.perday{margin-top:6px;font-size:14.5px;font-weight:700;color:var(--ac)}
.roi{margin-top:4px;font-size:13.5px;color:var(--tx2)}
.feat{margin:26px 0 30px;display:grid;gap:12px;flex:1}
.feat li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.feat svg{flex:none;width:18px;height:18px;margin-top:3px;color:var(--ac)}
.plan .btn{width:100%}
.plan:not(.pick) .btn{border-color:var(--bd);color:var(--tx)}
.plan:not(.pick) .btn::before{background:var(--tx)}
.plan:not(.pick) .btn:hover{color:#000}
.plans-note{margin-top:22px;color:var(--tx2);font-size:14.5px}

/* ---------- calculator ---------- */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:48px}
.panel{padding:clamp(24px,3.4vw,40px);border:1px solid var(--bd);border-radius:24px;background:var(--bg2)}
.ctl+.ctl{margin-top:30px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:600;font-size:15.5px;margin-bottom:14px}
.ctl output{font-family:var(--display);font-weight:600;font-size:20px;color:var(--ac);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;outline-offset:6px;
  background:linear-gradient(90deg,var(--ac) var(--p,30%),#2d2d2d var(--p,30%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--ac);cursor:grab}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--ac);cursor:grab}
.res-l{color:var(--tx2);font-size:15px}
.res-n{font-family:var(--display);font-weight:800;font-size:clamp(32px,5vw,52px);letter-spacing:-.05em;line-height:1.05;margin:8px 0 18px;color:var(--ac);font-variant-numeric:tabular-nums}
.res-n small{font-size:.38em;color:var(--tx2);font-weight:600;letter-spacing:0;margin-left:8px}
.res-p{padding-top:16px;border-top:1px solid var(--bd);color:var(--tx);font-size:15.5px}
.res-p+.res-p{margin-top:12px}
.loss{border-color:rgba(255,0,85,.55);background:linear-gradient(160deg,rgba(255,0,85,.1),rgba(255,0,85,.02) 60%),var(--bg2);display:flex;flex-direction:column}
.loss h3{font-size:clamp(20px,2.4vw,26px);font-weight:600;margin-bottom:12px}
.loss .res-n{color:var(--hot)}
.loss .btn{margin-top:auto;align-self:flex-start}
.loss p{color:var(--tx2);margin-bottom:20px}
.fine{margin-top:16px;color:#7a7a7a;font-size:13px}

/* ---------- sale ---------- */
.sale{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:48px}
.deal{position:relative;padding:clamp(26px,3.4vw,40px);border:1px solid var(--bd);border-radius:24px;background:var(--bg2);overflow:hidden}
.deal.on{border-color:var(--ac);box-shadow:0 0 40px rgba(0,255,136,.16)}
.deal .pct{font-family:var(--display);font-weight:800;font-size:clamp(54px,8vw,92px);letter-spacing:-.06em;line-height:.95;color:var(--hot)}
.deal.on .pct{color:var(--ac)}
.deal h3{font-size:19px;font-weight:600;margin:16px 0 8px;letter-spacing:-.02em}
.deal p{color:var(--tx2);font-size:15.5px}
.state{display:inline-block;margin-top:18px;padding:6px 14px;border-radius:999px;border:1px solid var(--bd);font-size:13.5px;font-weight:700;color:var(--tx2)}
.deal.on .state{background:var(--ac);border-color:var(--ac);color:#000}
.next{margin-top:12px;font-size:14px;color:var(--tx)}

/* ---------- faq ---------- */
.faq{margin-top:44px;border-top:1px solid var(--bd)}
.faq details{border-bottom:1px solid var(--bd)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 4px;font-weight:700;font-size:18px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--bd);border-radius:50%;color:var(--ac);font-size:20px;transition:transform .35s var(--ease),background .3s}
.faq details[open] summary::after{transform:rotate(45deg);background:var(--bg2)}
.faq details p{padding:0 56px 26px 4px;color:var(--tx2);max-width:68ch}

/* ---------- final cta ---------- */
.final{padding:clamp(34px,6vw,76px);border:1px solid var(--hot);border-radius:34px;background:linear-gradient(130deg,rgba(255,0,85,.12),rgba(255,0,85,.02) 60%),var(--bg2);text-align:left}
.final h2{font-size:clamp(28px,5.2vw,58px);font-weight:800;letter-spacing:-.05em;max-width:18ch}
.final p{color:var(--tx2);margin:20px 0 32px;max-width:48ch}
.final .cta .btn-s{border-color:var(--tx);color:var(--tx)}
.final .cta .btn-s::before{background:var(--tx)}
.final .cta .btn-s:hover{color:#000}

footer{border-top:1px solid var(--bd);padding:32px max(20px,calc((100% - 1080px)/2)) 40px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--tx2);font-size:14.5px}
footer a:hover{color:var(--ac)}

/* ---------- sticky mobile cta ---------- */
.sticky{display:none}

@media (max-width:860px){
  .sec{padding:72px 0}
  .hero{padding:170px 0 56px}
  .hero-grid{grid-template-columns:1fr;gap:36px}
  .proof ul{grid-template-columns:1fr}
  .proof li{border-left:0;border-top:1px solid var(--bd);padding:22px 0}
  .proof li:first-child{border-top:0}
  .how-frame{grid-template-columns:1fr;gap:32px}
  .plans{grid-template-columns:1fr;gap:28px}
  .calc,.sale{grid-template-columns:1fr}
  .faq details p{padding-right:8px}
  .cta .btn{width:100%}
  .sticky{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;gap:10px;align-items:center;justify-content:space-between;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(10,10,10,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--bd);
    transform:translateY(110%);transition:transform .4s var(--ease)}
  .sticky.show{transform:none}
  .sticky span{font-weight:700;font-size:14px;line-height:1.25}
  .sticky .btn{padding:12px 20px;font-size:15px;white-space:nowrap}
  footer{padding-bottom:90px}
}
@media (max-width:420px){
  .bar{font-size:12.5px}
  .lang button{min-width:40px;padding:4px 9px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="top" id="top">
  <div class="bar" id="bar"><span id="barText"></span><b id="barTimer">--:--:--</b></div>
  <header class="hd">
    <a class="logo" href="#home" aria-label="Hunta">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>
      HUNTA
    </a>
    <div class="hd-r">
      <a class="tg" href="https://t.me/huntaadmin" target="_blank" rel="noopener" aria-label="Telegram @huntaadmin">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.7 19.6c-.2 1-.9 1.3-1.7.8l-4.8-3.6-2.3 2.3c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2L6.5 13.4 1.8 12c-1-.3-1-1 .2-1.5L20.400 3.400c.9-.3 1.600.2 1.500.9z"/></svg>
      </a>
      <div class="lang" id="lang" data-l="ru" role="group" aria-label="Language">
        <i></i>
        <button type="button" data-l="ru" aria-pressed="true">RU</button>
        <button type="button" data-l="uz" aria-pressed="false">UZ</button>
      </div>
    </div>
  </header>
</div>

<main>
  <!-- HERO -->
  <section class="hero" id="home">
    <div class="hero-glow" id="glow" aria-hidden="true"></div>
    <div class="wrap hero-grid">
      <div>
        <h1 data-i="h1"></h1>
        <p class="lead" data-i="lead"></p>
        <div class="cta">
          <a class="btn btn-p" href="#plans" data-i="cta_plans"></a>
          <a class="btn btn-s" href="#how" data-i="cta_how"></a>
        </div>
      </div>
      <div class="field" id="field" aria-hidden="true">
        <span class="chip" style="left:30%;top:15%" data-c="0"></span>
        <span class="chip" style="left:72%;top:27%" data-c="1"></span>
        <span class="chip" style="left:27%;top:43%" data-c="2"></span>

var $$ = function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s))};
var fmt = function(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')};
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

var lang = 'ru';
try { if (localStorage.getItem('hunta_lang') === 'uz') lang = 'uz'; } catch(e){}
var role = 'free';
var lastMode = null;

/* =====================================================
   СКИДКИ: пятница (по Ташкенту) и праздники
   Для проверки: добавьте к адресу ?demo=friday или ?demo=holiday
   ===================================================== */
function saleState(){
  var demo = '';
  try { demo = new URLSearchParams(location.search).get('demo') || ''; } catch(e){}
  var shifted = Date.now() + CFG.tzOffsetHours*3600000;
  var d = new Date(shifted);
  var iso = d.toISOString().slice(0,10);
  var dow = d.getUTCDay();
  var dayStart = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  var DAY = 86400000;

  var hol = null;
  for (var i=0;i<CFG.holidays.length;i++){
    var h = CFG.holidays[i];
    if (iso >= h.from && iso <= h.to){ hol = h; break; }
  }
  if (demo === 'holiday' && !hol){ hol = CFG.holidays[0]; return {mode:'holiday', rate:CFG.holidayDiscount, hol:hol, left:(dayStart+2*DAY)-shifted, iso:iso}; }
  if (hol){
    var p = hol.to.split('-');
    return {mode:'holiday', rate:CFG.holidayDiscount, hol:hol, left:(Date.UTC(+p[0],+p[1]-1,+p[2])+DAY)-shifted, iso:iso};
  }
  if (dow === 5 || demo === 'friday'){
    return {mode:'friday', rate:CFG.fridayDiscount, left:(dayStart+DAY)-shifted, iso:iso};
  }
  var add = (5 - dow + 7) % 7; // дней до пятницы
  return {mode:'none', rate:0, left:(dayStart+add*DAY)-shifted, iso:iso};
}

function nextHoliday(iso){
  for (var i=0;i<CFG.holidays.length;i++){ if (CFG.holidays[i].to >= iso) return CFG.holidays[i]; }
  return null;
}

function fmtLeft(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), x = s%60;
  var z = function(n){return (n<10?'0':'')+n};
  var dd = lang==='ru' ? 'д' : 'k';
  return (d>0 ? d+dd+' ' : '') + z(h)+':'+z(m)+':'+z(x);
}

/* =====================================================
   РЕНДЕР
   ===================================================== */
var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.500"/></svg>';

function renderStatic(){
  var t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  $$('[data-i]').forEach(function(el){
    var v = t[el.dataset.i];
    if (typeof v === 'string') el.textContent = v;
  });
  $$('.chip').forEach(function(c){ c.textContent = t.chips[+c.dataset.c]; });
  $('#lang').dataset.l = lang;
  $$('#lang button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.l===lang)); });
  renderSteps(false);
  renderFaq();
  renderCalc();
  renderPlans();
  renderSale(true);
}

function renderSteps(animate){
  var t = T[lang], box = $('#steps');
  box.innerHTML = '';
  t.steps[role].forEach(function(s){
    var li = document.createElement('li');
    var h = document.createElement('h3'); h.textContent = s[0];
    var p = document.createElement('p'); p.textContent = s[1];
    li.appendChild(h); li.appendChild(p); box.appendChild(li);
  });
  if (animate && !reduce){ box.classList.remove('swap'); void box.offsetWidth; box.classList.add('swap'); }
  $('#tabFree').setAttribute('aria-selected', String(role==='free'));
  $('#tabCust').setAttribute('aria-selected', String(role==='cust'));
}

function renderFaq(){
  var box = $('#faqBox'); box.innerHTML = '';
  T[lang].faq.forEach(function(q){
    var d = document.createElement('details');
    var s = document.createElement('summary'); s.textContent = q[0];
    var p = document.createElement('p'); p.textContent = q[1];
    d.appendChild(s); d.appendChild(p); box.appendChild(d);
  });
}

function renderPlans(){
  var t = T[lang], st = saleState(), box = $('#plansBox');
  box.innerHTML = '';
  CFG.plans.forEach(function(pl){
    var info = t.plan[pl.id];
    var now = st.rate ? Math.round(pl.price*(1-st.rate)/1000)*1000 : pl.price;
    var art = document.createElement('article');
    art.className = 'plan ' + pl.id + (pl.pick ? ' pick' : '');
    var html = '';
    if (pl.pick) html += '<span class="badge">'+t.badge+'</span>';
    html += '<h3>'+info.n+'</h3>';
    html += '<div class="pr"><span class="now">'+fmt(now)+'</span>';
    if (st.rate) html += '<span class="old">'+fmt(pl.price)+'</span>';
    html += '</div><div class="unit">'+t.unit+'</div>';
    html += '<div class="perday">'+t.perday(fmt(now/30))+'</div>';
    var share = (pl.price/3000000*100).toFixed(1).replace('.',',').replace(',0','');
    html += '<div class="roi">'+t.roi(share)+'</div>';
    html += '<ul class="feat">'+info.f.map(function(f){return '<li>'+CHECK+'<span>'+f+'</span></li>'}).join('')+'</ul>';
    html += '<a class="btn '+(pl.pick?'btn-p':'btn-s')+'" href="'+CFG.bot+'" target="_blank" rel="noopener">'+t.choose(info.n)+'</a>';
    art.innerHTML = html;
    box.appendChild(art);
  });
  var note = $('#plansNote'), pc = Math.round(st.rate*100);
  note.textContent = st.mode==='friday' ? t.plans_note_fri(pc)
    : st.mode==='holiday' ? t.plans_note_hol(pc, st.hol[lang])
    : t.plans_note_none;
}

function renderSale(force){
  var t = T[lang], st = saleState(), pc = Math.round(st.rate*100);
  var bar = $('#bar');
  var text = st.mode==='friday' ? t.bar_fri(pc) : st.mode==='holiday' ? t.bar_hol(pc, st.hol[lang]) : t.bar_wait(Math.round(CFG.fridayDiscount*100));
  $('#barText').textContent = text;
  $('#barTimer').textContent = fmtLeft(st.left);
  bar.classList.toggle('live', st.mode!=='none');

  $('#dealFri').classList.toggle('on', st.mode==='friday');
  $('#dealHol').classList.toggle('on', st.mode==='holiday');
  $('#friState').textContent = st.mode==='friday' ? t.st_on+' · '+fmtLeft(st.left) : t.st_fri_off+' · '+fmtLeft(st.left);
  $('#holState').textContent = st.mode==='holiday' ? t.st_on+' · '+fmtLeft(st.left) : t.st_hol_off;
  var nh = nextHoliday(st.iso);
  $('#holNext').textContent = nh ? t.next_hol(nh[lang], lang==='ru'?nh.dru:nh.duz) : '';

  var s = $('#stickyText');
  s.textContent = st.mode==='friday' ? t.sticky_fri(pc) : st.mode==='holiday' ? t.sticky_hol(pc) : t.sticky_none;

  if (lastMode !== st.mode && !force){ renderPlans(); }
  lastMode = st.mode;
}

function renderCalc(){
  var t = T[lang];
  var o = +$('#rOrders').value, c = +$('#rCheck').value, income = o*c;
  $('#oOrders').textContent = o;
  $('#oCheck').textContent = fmt(c);
  $('#rOrders').style.setProperty('--p', ((o-1)/29*100)+'%');
  $('#rCheck').style.setProperty('--p', ((c-100000)/1900000*100)+'%');
  $('#income').textContent = fmt(income);
  var startPrice = 30000;
  var share = (startPrice/income*100);
  $('#startShare').textContent = t.share((share<10 ? share.toFixed(1) : Math.round(share)).toString().replace('.',',').replace(',0',''));
  $('#payback').textContent = c >= startPrice ? t.payback_one : t.payback_many(Math.ceil(startPrice/c));
  $('#perDay').textContent = fmt(income/30);
  $('#perWeek').textContent = t.loss_week(fmt(income/30*7));
}

/* =====================================================
   ОХОТА: прицел переходит от задачи к задаче
   ===================================================== */
function initHunt(){
  var field = $('#field'), ret = $('#ret'), chips = $$('.chip', field);
  var idx = 0, tm = null, cur = null;
  function pos(chip){
    var fr = field.getBoundingClientRect(), cr = chip.getBoundingClientRect();
    var x = cr.left - fr.left + cr.width/2, y = cr.top - fr.top + cr.height/2;
    ret.style.transform = 'translate('+x+'px,'+y+'px) translate(-50%,-50%)';
  }
  function lock(chip){
    chips.forEach(function(c){c.classList.remove('lock')});
    chip.classList.add('lock'); ret.classList.add('on'); cur = chip;
  }
  function step(){
    var chip = chips[idx % chips.length]; idx++;
    ret.classList.remove('on'); chips.forEach(function(c){c.classList.remove('lock')});
    pos(chip);
    setTimeout(function(){ lock(chip); }, reduce ? 0 : 950);
  }
  if (reduce){ step(); return; }
  step();
  tm = setInterval(step, 2600);
  addEventListener('resize', function(){ if (cur) pos(cur); });
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ clearInterval(tm); } else { clearInterval(tm); tm = setInterval(step, 2600); }
  });
}

/* =====================================================
   СОБЫТИЯ
   ===================================================== */
$$('#lang button').forEach(function(b){
  b.addEventListener('click', function(){
    lang = b.dataset.l;
    try { localStorage.setItem('hunta_lang', lang); } catch(e){}
    renderStatic();
  });
});
$$('.roles button').forEach(function(b){
  b.addEventListener('click', function(){ role = b.dataset.role; renderSteps(true); });
});
$('#rOrders').addEventListener('input', renderCalc);
$('#rCheck').addEventListener('input', renderCalc);

var hero = $('#home'), glow = $('#glow');
if (hero && !reduce){
  hero.addEventListener('pointermove', function(e){
    var r = hero.getBoundingClientRect();
    glow.style.setProperty('--mx', (e.clientX - r.left)+'px');
    glow.style.setProperty('--my', (e.clientY - r.top)+'px');
  });
}

// липкая кнопка на телефоне: появляется после первого экрана, прячется у тарифов
var sticky = $('#sticky'), plansSec = $('#plans'), ticking = false;
function onScroll(){
  if (ticking) return; ticking = true;
  requestAnimationFrame(function(){
    var y = scrollY, pr = plansSec.getBoundingClientRect();
    var inPlans = pr.top < innerHeight*0.6 && pr.bottom > innerHeight*0.2;
    sticky.classList.toggle('show', y > innerHeight*0.7 && !inPlans);
    ticking = false;
  });
}
addEventListener('scroll', onScroll, {passive:true});

// отступ под фиксированную шапку считаем по факту
function fitTop(){
  var h = $('#top').offsetHeight;
  hero.style.paddingTop = (h + 64) + 'px';
  document.documentElement.style.scrollPaddingTop = (h + 12) + 'px';
}
addEventListener('resize', fitTop);

renderStatic();
fitTop();
initHunt();
onScroll();
setInterval(function(){ renderSale(false); fitTop(); }, 1000);
})();
</script>
</body>
</html>
